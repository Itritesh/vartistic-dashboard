<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vartistic Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2f2c;--ink:#f3eee2;--mute:#a9bdb6;--sun:#f0b44c;--coral:#ee7b63;--mint:#7fd6b0;--line:rgba(255,255,255,.14);--r:22px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.bgf{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bgf i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 20s ease-in-out infinite alternate}
.bgf i:nth-child(1){width:50vw;height:50vw;background:#2c8a73;left:-12vw;top:-14vw;opacity:.6}
.bgf i:nth-child(2){width:36vw;height:36vw;background:var(--sun);right:-8vw;top:24vh;opacity:.28;animation-delay:-7s}
.bgf i:nth-child(3){width:32vw;height:32vw;background:var(--coral);left:28vw;bottom:-18vw;opacity:.26;animation-delay:-12s}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dasharray:0 400}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14);animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.still .glass,.still .seg,.still .bar,.still .col i,.still .pg i{animation:none!important}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
h2{font-size:30px;line-height:1.1}h3{font-size:18px;margin-bottom:14px}h4{margin:18px 0 8px;font-size:15px}
p{color:var(--mute)}small,.tiny{color:var(--mute);font-size:13px}.mute{color:var(--mute)}
a{color:var(--sun)}
input,select,textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:11px 14px;font:inherit;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--sun);box-shadow:0 0 0 3px rgba(240,180,76,.18)}
select option{background:#16413c}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--sun)}
.f{display:block;margin-top:14px;font-size:14px;color:var(--mute)}.f input,.f select,.f textarea{margin-top:6px;color:var(--ink)}
.btn{background:var(--sun);color:#2a1d04;border:0;border-radius:13px;padding:11px 20px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.25s;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(240,180,76,.35)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{box-shadow:none;background:rgba(255,255,255,.16)}
.btn.danger{color:var(--coral)}.btn.sm{padding:7px 14px;font-size:13px}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.card-auth{width:min(420px,100%);padding:36px}
.card-auth h1{font-size:30px;margin:18px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:9px 9px 9px 3px;background:linear-gradient(135deg,var(--sun),var(--coral));display:inline-block;animation:spin 8s linear infinite}
@keyframes spin{50%{border-radius:3px 9px 9px 9px}}
.pills{display:flex;gap:8px;margin:20px 0 4px}.pills label{flex:1;position:relative}.pills input{position:absolute;opacity:0}
.pills span{display:block;text-align:center;padding:10px;border-radius:13px;border:1px solid var(--line);cursor:pointer;transition:.2s}
.pills input:checked+span{background:var(--sun);color:#2a1d04;font-weight:600}.pills input:focus-visible+span{outline:2px solid var(--sun)}
.card-auth .btn{width:100%;margin-top:22px}.card-auth .tiny{margin-top:16px}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;gap:22px;padding:22px;min-height:100vh}
.side{position:sticky;top:22px;height:calc(100vh - 44px);display:flex;flex-direction:column;padding:22px 14px}
.side .brand{padding:0 10px 24px}
nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:0;background:none;color:var(--mute);font:500 15px inherit;font-family:inherit;cursor:pointer;transition:.25s;text-align:left}
.nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv:hover{background:rgba(255,255,255,.09);color:var(--ink);transform:translateX(3px)}
.nv.on{background:rgba(240,180,76,.18);color:var(--sun);box-shadow:inset 0 0 0 1px rgba(240,180,76,.35)}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.me div{flex:1;line-height:1.2;min-width:0}.me small{display:block}
.ico{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;transition:.2s}.ico:hover{color:var(--coral);border-color:var(--coral)}
.av{position:relative;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2c8a73,var(--sun));display:grid;place-items:center;font-weight:800;color:#12302b;flex:none;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 24px;gap:12px;flex-wrap:wrap}
.view>*+*{margin-top:18px}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.stat{padding:20px}.stat b{display:block;font-size:40px;line-height:1;font-weight:800;margin-bottom:6px}.stat span{color:var(--mute);font-size:14px}
.stat.coral b{color:var(--coral)}.stat.sun b{color:var(--sun)}.stat.mint b{color:var(--mint)}
.cols{display:grid;grid-template-columns:minmax(280px,1fr) 1.6fr;gap:18px}.cols2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.panel{padding:24px}
.dwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:none}.seg{animation:draw 1.2s cubic-bezier(.3,.7,.2,1) both}
.dn{font:800 30px 'Bricolage Grotesque',sans-serif;fill:var(--ink)}.dl{font-size:11px;fill:var(--mute)}
.lg{display:flex;flex-direction:column;gap:10px}.lg div{display:flex;align-items:center;gap:10px}.lg i{width:11px;height:11px;border-radius:4px}.lg b{margin-left:auto;padding-left:18px}
i.pending,.bar i.pending{background:var(--coral)}i.processing{background:var(--sun)}i.completed{background:var(--mint)}
.wl{display:grid;grid-template-columns:70px 1fr 44px;gap:12px;align-items:center;margin:12px 0}
.wl em{font-style:normal;color:var(--mute);font-size:13px;text-align:right}
.bar{display:flex;height:12px;border-radius:9px;overflow:hidden;transform-origin:left;animation:grow 1s cubic-bezier(.3,.7,.2,1) both;min-width:6px}.bar i{height:100%}
.week{display:flex;gap:10px;height:160px}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bw{flex:1;width:100%;display:flex;align-items:flex-end}.col i{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(var(--mint),#3e9c7c);transform-origin:bottom;animation:rise .9s cubic-bezier(.3,.7,.2,1) both;min-height:5px}
.col.z i{background:rgba(255,255,255,.12)}.col small{font-size:12px}.col b{font-size:13px}
.ev{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column}.ev:last-child{border:0}.ev span{color:var(--mute);font-size:13px}
.empty{padding:34px;text-align:center;color:var(--mute)}
/* tasks */
.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:14px}
.list{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:18px 22px;transition:.3s}.row:hover{transform:translateY(-3px);background:rgba(255,255,255,.12)}
.row p{font-size:14px;margin:2px 0 8px;max-width:60ch}.rs{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.ra{display:flex;gap:8px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}.meta .late{color:var(--coral);font-weight:600}
.pr{font-weight:600}.pr.high{color:var(--coral)}.pr.medium{color:var(--sun)}.pr.low{color:var(--mint)}
.chip{font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid;white-space:nowrap}
.chip.pending{color:var(--coral);background:rgba(238,123,99,.14);border-color:rgba(238,123,99,.4)}
.chip.processing,.chip.wait{color:var(--sun);background:rgba(240,180,76,.14);border-color:rgba(240,180,76,.4)}
.chip.completed{color:var(--mint);background:rgba(127,214,176,.14);border-color:rgba(127,214,176,.4)}
.task{padding:22px;transition:.3s}.task:hover{transform:translateY(-3px)}
.th{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.th b{font-size:18px}.task>p{margin:10px 0 14px}
.note{background:rgba(238,123,99,.14);border:1px solid rgba(238,123,99,.4);border-radius:13px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.seg3{display:inline-flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg3 button{border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:11px;font:500 14px inherit;font-family:inherit;cursor:pointer;transition:.25s}
.seg3 button:hover{color:var(--ink)}.seg3 .on{color:#2a1d04;font-weight:600}.seg3 .on.pending{background:var(--coral)}.seg3 .on.processing{background:var(--sun)}.seg3 .on.completed{background:var(--mint)}
.up{margin-top:18px;padding:18px;border-radius:16px;border:1.5px dashed rgba(127,214,176,.5);background:rgba(127,214,176,.07);animation:pop .45s both}
.uh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.file{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-top:8px;border-radius:12px;background:rgba(0,0,0,.2)}.file a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:8px}.x:hover{color:var(--coral)}
/* team + github */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.mc{padding:22px;transition:.3s}.mc:hover{transform:translateY(-4px)}.mh{display:flex;gap:12px;align-items:center;margin-bottom:16px}.mh div{line-height:1.25}.mh small{display:block}
.pg{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:10px}.pg i{display:block;height:100%;background:var(--mint);border-radius:9px;transform-origin:left;animation:grow 1s both}
.mm{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
.gl{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:14px}.gl em{font-style:normal;font-size:12px;color:var(--mute)}.gl em.ok{color:var(--mint)}
.act{margin:6px 0 14px;font-size:14px}
.tip{padding:14px 20px}code{background:rgba(0,0,0,.3);padding:2px 8px;border-radius:8px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;z-index:20;overflow:auto}
.sheet{width:min(560px,100%);padding:28px;animation:pop .4s cubic-bezier(.2,.8,.2,1) both;background:rgba(22,65,60,.78)}
.mt{display:flex;justify-content:space-between;align-items:flex-start}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chk label{display:flex;gap:7px;align-items:center;padding:7px 14px;border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--ink);transition:.2s}.chk label:hover{background:rgba(255,255,255,.1)}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.tt{background:rgba(22,65,60,.9);backdrop-filter:blur(14px);border:1px solid var(--line);border-left:4px solid var(--mint);padding:12px 18px;border-radius:14px;animation:pop .35s both;max-width:320px}.tt.err{border-left-color:var(--coral)}
@media(max-width:900px){.cols,.cols2,.tools{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
@media(max-width:820px){.shell{grid-template-columns:1fr;padding:14px 14px 96px}.side{position:fixed;z-index:10;top:auto;bottom:12px;left:12px;right:12px;height:auto;flex-direction:row;padding:8px;align-items:center}
.side .brand,.nv span,.me div{display:none}nav{flex-direction:row;justify-content:space-around}.me{border:0;padding:0}.nv{padding:11px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgf"><i></i><i></i><i></i></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='vartistic.v1',SK='vartistic.session',DEF='welcome123';
const NAMES=['Ritesh','Sarib','Owais','Rohit','Saniya'];
const ST={pending:'Pending',processing:'In progress',completed:'Completed'};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',tasks:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6M16 5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3.300 2.500 3.500 6"/>',git:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.500v7M18 10.500c0 4-6 3-11 6"/>'};
const parse=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let db=parse(K),ses=parse(SK),tab='home',F={st:'all',who:'all',q:''},lock=false;
const app=$('#app');

async function hash(t){const s='vt::'+t;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'x'+h}
function save(){try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){toast('Browser storage is full. Remove some uploaded files.','err');return false}}
function toast(m,t){const el=document.createElement('div');el.className='tt '+(t||'');el.textContent=m;$('#toast').append(el);setTimeout(()=>el.remove(),3400)}
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const fmtD=d=>d?new Date(d+'T00:00').toLocaleDateString('en',{day:'numeric',month:'short'}):'No date';
const size=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const task=id=>db.tasks.find(t=>t.id===id);
const who=id=>(db.members.find(m=>m.id===id)||{name:'Removed member'}).name;
const overdue=t=>t.due&&t.status!=='completed'&&t.due<today();
const logAct=text=>{db.log.unshift({t:Date.now(),text});db.log=db.log.slice(0,40)};
const stats=l=>{const s={total:l.length,pending:0,processing:0,completed:0,approved:0};l.forEach(t=>{s[t.status]++;if(t.review==='approved')s.approved++});return s};
const avatar=m=>`<span class="av">${esc(m.name[0])}${m.gh&&m.gh.avatar?`<img src="${esc(m.gh.avatar)}" alt="" onerror="this.remove()">`:''}</span>`;
const me=()=>{if(!ses||!db)return null;if(ses.role==='admin')return db.admin?{role:'admin',name:'Admin',email:db.admin.email,id:'admin'}:null;const m=db.members.find(x=>x.id===ses.id);return m?{...m,role:'member'}:null};

/* github */
async function ghGet(path){const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch('https://api.github.com'+path,{signal:c.signal,headers:{Accept:'application/vnd.github+json'}});clearTimeout(t);return{ok:r.ok,status:r.status,data:r.ok?await r.json():null}}catch(e){clearTimeout(t);return{ok:false,status:0,data:null}}}
async function loadGh(id){const m=db.members.find(x=>x.id===id),box=$('#gh-'+id);if(!m||!m.gh||!box)return;box.innerHTML='<small>Loading…</small>';const r=await ghGet(`/users/${encodeURIComponent(m.gh.user)}/events/public?per_page=30`);
 if(!r.ok){box.innerHTML=`<small>${r.status===403?'GitHub rate limit reached. Try again in a while.':'Could not reach GitHub from here. Open the profile link instead.'}</small>`;return}
 const p=r.data.filter(e=>e.type==='PushEvent').slice(0,4);
 box.innerHTML=p.length?p.map(e=>{const c=e.payload.commits&&e.payload.commits[0],n=e.payload.size||(e.payload.commits||[]).length;return`<div class="ev"><b>${esc(e.repo.name)}</b><span>Branch ${esc((e.payload.ref||'').replace('refs/heads/',''))}, ${n} commit${n==1?'':'s'}, ${ago(Date.parse(e.created_at))}</span>${c?`<small>${esc(c.message.split('\n')[0])}</small>`:''}</div>`}).join(''):'<small>No public pushes lately.</small>'}
async function loadCommits(id){const t=task(id),box=$('#cm-'+id);if(!t||!box)return;const m=(t.repo||'').match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/i);if(!m){box.innerHTML='<small>Link must look like https://github.com/owner/repo</small>';return}
 box.innerHTML='<small>Loading…</small>';const r=await ghGet(`/repos/${m[1]}/${m[2].replace(/\.git$/,'')}/commits?per_page=3`);
 if(!r.ok){box.innerHTML=`<small>${r.status===404?'Repository not found, or it is private.':'Could not reach GitHub from here.'}</small>`;return}
 box.innerHTML=r.data.map(c=>`<div class="ev"><b>${esc(c.commit.message.split('\n')[0])}</b><span>${esc(c.commit.author.name)}, ${ago(Date.parse(c.commit.author.date))}</span></div>`).join('')||'<small>No commits yet.</small>'}

/* modal */
function modal(h,l){lock=!!l;$('#modal').innerHTML=`<div class="scrim"><div class="sheet glass">${h}</div></div>`}
function closeM(){lock=false;$('#modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lock)closeM()});
function ghGate(forced){modal(`<h3>Connect your GitHub</h3><p>${forced?'One quick step before you start. ':''}Your admin can see your latest pushes and the repos you attach to tasks.</p><form data-form="gh"><label class="f">GitHub username or profile link<input name="user" required placeholder="octocat" autocomplete="off"></label><div class="btns"><button class="btn">Connect GitHub</button>${forced?'':'<button type="button" class="btn ghost" data-act="close">Cancel</button>'}</div></form>`,forced)}

/* views */
function authView(){const setup=!db.admin;return`<div class="auth"><div class="glass card-auth"><div class="brand"><i class="mark"></i>Vartistic</div><h1>${setup?'Create the admin account':'Welcome back'}</h1><p>${setup?'This email becomes the admin login on this browser.':'Sign in to your agency workspace.'}</p>
<form data-form="${setup?'setup':'login'}">${setup?'':'<div class="pills"><label><input type="radio" name="role" value="admin" checked><span>Admin</span></label><label><input type="radio" name="role" value="member"><span>Team member</span></label></div>'}
<label class="f">Email<input name="email" type="email" required placeholder="you@vartistic.com" autocomplete="username"></label>
<label class="f">Password<input name="pw" type="password" required minlength="6" autocomplete="current-password"></label>
${setup?'<label class="f">Confirm password<input name="pw2" type="password" required minlength="6"></label>':''}
<button class="btn">${setup?'Create admin':'Sign in'}</button></form>
${setup?'':'<p class="tiny">Team emails look like name@vartistic.com. Your admin gives you the starting password.</p>'}</div></div>`}

function shell(u){const adm=u.role==='admin';
 const nav=adm?[['home','Overview','home'],['tasks','Tasks','tasks'],['team','Team','team'],['github','GitHub','git']]:[['home','Overview','home'],['tasks','My tasks','tasks'],['github','GitHub','git']];
 const titles={home:adm?'Agency overview':`Hi ${u.name}`,tasks:adm?'Tasks':'My tasks',team:'Team',github:'GitHub activity'};
 const V={home:homeV,tasks:adm?tasksA:mineV,team:teamV,github:gitV};
 return`<div class="shell"><aside class="side glass"><div class="brand"><i class="mark"></i>Vartistic</div><nav>${nav.map(([k,l,i])=>`<button class="nv ${tab===k?'on':''}" data-act="nav" data-v="${k}"><svg viewBox="0 0 24 24">${IC[i]}</svg><span>${l}</span></button>`).join('')}</nav>
 <div class="me">${adm?'<span class="av">A</span>':avatar(u)}<div><b>${esc(u.name)}</b><small>${adm?'Admin':'Team member'}</small></div><button class="ico" data-act="out">Sign out</button></div></aside>
 <main><header class="top"><div><small>${new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})}</small><h2>${titles[tab]}</h2></div>${adm&&tab==='tasks'?'<button class="btn" data-act="newtask">New task</button>':''}</header><section class="view">${V[tab](u)}</section></main></div>`}

function donut(s){const C=2*Math.PI*52,col={pending:'var(--coral)',processing:'var(--sun)',completed:'var(--mint)'};let acc=0;
 const segs=s.total?['pending','processing','completed'].map(k=>{const l=s[k]/s.total*C,el=`<circle class="seg" cx="70" cy="70" r="52" fill="none" stroke="${col[k]}" stroke-width="15" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=l;return el}).join(''):'';
 return`<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Task status chart"><circle cx="70" cy="70" r="52" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="15"/>${segs}<text x="70" y="72" text-anchor="middle" class="dn">${s.total}</text><text x="70" y="90" text-anchor="middle" class="dl">total tasks</text></svg>`}
function week(l){const d=[];for(let i=6;i>=0;i--){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-i);d.push({l:x.toLocaleDateString('en',{weekday:'short'}),s:+x,n:0})}l.forEach(t=>{if(t.done){const k=d.find(o=>t.done>=o.s&&t.done<o.s+864e5);if(k)k.n++}});return d}

function homeV(u){const adm=u.role==='admin',l=adm?db.tasks:db.tasks.filter(t=>t.to===u.id),s=stats(l);
 const cards=(adm?[['Candidates',db.members.length,'','candidates'],['Total tasks',s.total,'','total']]:[['Assigned to me',s.total,'','total'],['Approved by admin',s.approved,'mint','approved']]).concat([['Pending',s.pending,'coral','pending'],['In progress',s.processing,'sun','processing'],['Completed',s.completed,'mint','completed']]);
 const w=week(l),mx=Math.max(1,...w.map(x=>x.n)),top=Math.max(1,...db.members.map(m=>db.tasks.filter(t=>t.to===m.id).length));
 const left=adm?`<div class="panel glass" style="--i:6"><h3>Workload by candidate</h3>${db.members.map(m=>{const q=stats(db.tasks.filter(t=>t.to===m.id));return`<div class="wl"><span>${esc(m.name)}</span><div class="bar" style="width:${q.total/top*100}%">${['completed','processing','pending'].map(k=>q[k]?`<i class="${k}" style="flex:${q[k]}"></i>`:'').join('')}</div><em>${q.completed}/${q.total}</em></div>`}).join('')}</div>`
 :`<div class="panel glass" style="--i:6"><h3>Coming up</h3>${l.filter(t=>t.status!=='completed').sort((a,b)=>String(a.due||'9').localeCompare(String(b.due||'9'))).slice(0,5).map(t=>`<div class="ev"><b>${esc(t.title)}</b><span class="${overdue(t)?'':''}">${overdue(t)?'Overdue since ':'Due '}${fmtD(t.due)}</span></div>`).join('')||'<p>Nothing waiting on you. Nice.</p>'}</div>`;
 const right=adm?`<div class="panel glass" style="--i:8"><h3>Recent activity</h3>${db.log.slice(0,6).map(a=>`<div class="ev"><span>${ago(a.t)}</span>${esc(a.text)}</div>`).join('')||'<p>Activity shows up here as the team works.</p>'}</div>`:'';
 return`<div class="stats">${cards.map(([lb,n,c,k],i)=>`<div class="stat glass ${c}" style="--i:${i}" data-k="${k}"><b data-count="${n}">${n}</b><span>${lb}</span></div>`).join('')}</div>
 <div class="cols"><div class="panel glass" style="--i:5"><h3>Task status</h3><div class="dwrap">${donut(s)}<div class="lg">${Object.entries(ST).map(([k,v])=>`<div><i class="${k}"></i>${v}<b>${s[k]}</b></div>`).join('')}</div></div></div>${left}</div>
 <div class="${adm?'cols2':''}"><div class="panel glass" style="--i:7"><h3>Completed in the last 7 days</h3><div class="week">${w.map(x=>`<div class="col ${x.n?'':'z'}"><b>${x.n}</b><div class="bw"><i style="height:${x.n/mx*100}%"></i></div><small>${x.l}</small></div>`).join('')}</div></div>${right}</div>`}

const rev=t=>t.status==='completed'?`<span class="chip ${t.review==='approved'?'completed':'wait'}">${t.review==='approved'?'Approved':'Awaiting review'}</span>`:t.review==='rework'?'<span class="chip pending">Sent back</span>':'';
const filt=()=>db.tasks.filter(t=>(F.st==='all'||t.status===F.st)&&(F.who==='all'||t.to===F.who)&&(!F.q||(t.title+' '+t.desc).toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>b.created-a.created);
function adminRow(t,i){return`<div class="row glass" style="--i:${Math.min(i,8)}"><div><b>${esc(t.title)}</b><p>${esc(t.desc||'No description')}</p><div class="meta"><span>${esc(who(t.to))}</span><span class="${overdue(t)?'late':''}">${overdue(t)?'Overdue, due ':'Due '}${fmtD(t.due)}</span><span class="pr ${t.prio}">${t.prio} priority</span><span>${t.files.length} file${t.files.length==1?'':'s'}</span></div></div><div class="rs"><span class="chip ${t.status}">${ST[t.status]}</span>${rev(t)}</div><div class="ra"><button class="btn sm ghost" data-act="view" data-id="${t.id}">${t.status==='completed'&&t.review!=='approved'?'Review':'Open'}</button><button class="btn sm ghost danger" data-act="del" data-id="${t.id}">Delete</button></div></div>`}
const listHtml=()=>{const l=filt();return l.length?l.map(adminRow).join(''):'<div class="empty glass">No tasks here yet. Use “New task” to share work with the team.</div>'};
function tasksA(){return`<div class="tools glass"><input data-f="q" placeholder="Search tasks" value="${esc(F.q)}"><select data-f="st"><option value="all">All statuses</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${F.st===k?'selected':''}>${v}</option>`).join('')}</select><select data-f="who"><option value="all">Everyone</option>${db.members.map(m=>`<option value="${m.id}" ${F.who===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div id="tlist" class="list">${listHtml()}</div>`}
function mCard(t,i){const c=t.status==='completed';return`<article class="task glass" style="--i:${Math.min(i,8)}"><div class="th"><div><b>${esc(t.title)}</b><div class="meta"><span class="${overdue(t)?'late':''}">${overdue(t)?'Overdue, due ':'Due '}${fmtD(t.due)}</span><span class="pr ${t.prio}">${t.prio} priority</span></div></div>${rev(t)}</div><p>${esc(t.desc||'')}</p>${t.review==='rework'&&t.note?`<div class="note">Admin note: ${esc(t.note)}</div>`:''}
<div class="seg3">${Object.entries(ST).map(([k,v])=>`<button class="${t.status===k?'on '+k:''}" data-act="set" data-id="${t.id}" data-v="${k}">${v}</button>`).join('')}</div>
${c?`<div class="up"><div class="uh"><b>Submit your work</b><label class="btn sm">Upload files<input type="file" multiple hidden data-up="${t.id}"></label></div><p class="tiny">Any file type, up to 1.5 MB each. For bigger work, push it to GitHub and paste the repo link below.</p>${t.files.map(f=>`<div class="file"><a href="${f.data}" download="${esc(f.name)}">${esc(f.name)}</a><small>${size(f.size)}</small><button class="x" data-act="rmf" data-id="${t.id}" data-v="${f.id}" aria-label="Remove file">✕</button></div>`).join('')}<label class="f">Repository link<input data-repo="${t.id}" value="${esc(t.repo||'')}" placeholder="https://github.com/you/project"></label></div>`:''}</article>`}
function mineV(u){const l=db.tasks.filter(t=>t.to===u.id).sort((a,b)=>(a.status==='completed')-(b.status==='completed')||String(a.due||'9').localeCompare(String(b.due||'9')));return l.length?`<div class="list">${l.map(mCard).join('')}</div>`:'<div class="empty glass">No tasks assigned to you yet. They will appear here.</div>'}
function teamV(){return`<div class="tip glass">Every team member starts with the password <code>${DEF}</code>. Use Reset if someone forgets theirs.</div><div class="grid3">${db.members.map((m,i)=>{const q=stats(db.tasks.filter(t=>t.to===m.id));return`<div class="mc glass" style="--i:${i}"><div class="mh">${avatar(m)}<div><b>${esc(m.name)}</b><small>${esc(m.email)}</small></div></div><div class="pg"><i style="width:${q.total?q.completed/q.total*100:0}%"></i></div><div class="mm"><span>${q.completed} of ${q.total} done</span><span>${q.processing} active</span><span>${q.pending} pending</span></div><div class="gl">${m.gh?`<a href="${esc(m.gh.url)}" target="_blank" rel="noopener">@${esc(m.gh.user)}</a><em class="${m.gh.verified?'ok':''}">${m.gh.verified?'Verified':'Unverified'}</em>`:'<em>GitHub not connected yet</em>'}</div><button class="btn sm ghost" data-act="rpw" data-id="${m.id}">Reset password</button></div>`}).join('')}</div><div><button class="btn sm ghost danger" data-act="wipe">Erase all workspace data</button></div>`}
function gitV(u){const adm=u.role==='admin',list=adm?db.members:db.members.filter(m=>m.id===u.id),repos=db.tasks.filter(t=>t.repo&&(adm||t.to===u.id));
 return`<div class="grid2">${list.map((m,i)=>`<div class="mc glass" style="--i:${i}"><div class="mh">${avatar(m)}<div><b>${esc(m.name)}</b><small>${m.gh?'@'+esc(m.gh.user):'Not connected'}</small></div></div>${m.gh?`<div class="gl"><a href="${esc(m.gh.url)}" target="_blank" rel="noopener">Open profile</a>${m.gh.repos!=null?`<em>${m.gh.repos} public repos</em>`:''}</div><div id="gh-${m.id}" class="act"><small>Press refresh to pull the latest pushes.</small></div><div class="btns" style="margin-top:0"><button class="btn sm" data-act="ghload" data-id="${m.id}">Refresh activity</button>${adm?'':'<button class="btn sm ghost" data-act="ghchange">Change account</button>'}</div>`:'<p>Waiting for this member to connect.</p>'}</div>`).join('')}</div>
 <div class="panel glass" style="--i:6"><h3>Project repositories</h3>${repos.map(t=>`<div class="ev"><b>${esc(t.title)}</b><span>${esc(who(t.to))}, <span class="chip ${t.status}">${ST[t.status]}</span></span><div class="btns" style="margin:6px 0 0"><a href="${esc(t.repo)}" target="_blank" rel="noopener">Open repo</a><button class="btn sm ghost" data-act="commits" data-id="${t.id}">Latest commits</button></div><div id="cm-${t.id}" class="act"></div></div>`).join('')||'<p>Repo links appear here once a task is completed with a repository attached.</p>'}</div>`}

/* modals */
function newTask(){modal(`<h3>New task</h3><form data-form="task"><label class="f">Title<input name="title" required maxlength="80"></label><label class="f">Details<textarea name="desc" rows="3"></textarea></label><div class="two"><label class="f">Due date<input type="date" name="due" min="${today()}"></label><label class="f">Priority<select name="prio"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></label></div><div class="f">Share with<div class="chk">${db.members.map(m=>`<label><input type="checkbox" name="to" value="${m.id}">${esc(m.name)}</label>`).join('')}<label><input type="checkbox" id="all">Everyone</label></div></div><div class="btns"><button class="btn">Share task</button><button type="button" class="btn ghost" data-act="close">Cancel</button></div></form>`)}
function viewTask(id){const t=task(id);if(!t)return;const ok=/^https?:\/\//i.test(t.repo||'');
 modal(`<div class="mt"><h3>${esc(t.title)}</h3><button class="x" data-act="close" aria-label="Close">✕</button></div><div class="meta"><span>${esc(who(t.to))}</span><span>Due ${fmtD(t.due)}</span><span class="pr ${t.prio}">${t.prio} priority</span><span class="chip ${t.status}">${ST[t.status]}</span></div><p style="margin-top:12px">${esc(t.desc||'No description')}</p>
 <h4>Submitted files</h4>${t.files.map(f=>`<div class="file"><a href="${f.data}" download="${esc(f.name)}">${esc(f.name)}</a><small>${size(f.size)}</small></div>`).join('')||'<p>Nothing uploaded yet.</p>'}
 <h4>Repository</h4>${ok?`<a href="${esc(t.repo)}" target="_blank" rel="noopener">${esc(t.repo)}</a><div class="btns" style="margin-top:8px"><button class="btn sm ghost" data-act="commits" data-id="${t.id}">Latest commits</button></div><div id="cm-${t.id}" class="act"></div>`:'<p>No repository linked.</p>'}
 ${t.status==='completed'?`<h4>Review</h4><textarea id="rn" rows="2" placeholder="Note for the member (used when sending back)"></textarea><div class="btns"><button class="btn" data-act="approve" data-id="${t.id}">Approve</button><button class="btn ghost danger" data-act="rework" data-id="${t.id}">Send back</button></div>`:'<p class="tiny" style="margin-top:14px">Review opens once the member marks this task completed.</p>'}`)}

async function addFiles(id,files){const t=task(id);if(!t)return;const before=t.files.length;
 for(const f of files){if(f.size>1.5*1048576){toast(`${f.name} is over 1.5 MB. Push it to GitHub and paste the link.`,'err');continue}
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});t.files.push({id:uid(),name:f.name,size:f.size,type:f.type,data,at:Date.now()})}
 if(t.files.length===before)return;logAct(`${who(t.to)} uploaded ${t.files.length-before} file(s) to “${t.title}”`);if(!save()){t.files.length=before;db.log.shift();return}toast('Files uploaded');render(0)}

/* events */
document.addEventListener('click',async e=>{
 if(e.target.classList&&e.target.classList.contains('scrim')&&!lock)return closeM();
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
 if(a==='close')return closeM();
 if(a==='nav'){tab=v;return render()}
 if(a==='out'){ses=null;localStorage.removeItem(SK);tab='home';return render()}
 const u=me();if(!u)return;const t=id?task(id):null;
 if(a==='newtask')newTask();
 else if(a==='view')viewTask(id);
 else if(a==='del'&&t&&confirm('Delete this task for good?')){db.tasks=db.tasks.filter(x=>x.id!==id);logAct(`Deleted “${t.title}”`);save();render(0)}
 else if(a==='set'&&t&&t.to===u.id&&t.status!==v){t.status=v;t.done=v==='completed'?Date.now():null;if(v==='completed'){t.review=null;t.note=''}else if(t.review==='approved')t.review=null;logAct(`${u.name} moved “${t.title}” to ${ST[v]}`);save();render(0)}
 else if(a==='rmf'&&t){t.files=t.files.filter(f=>f.id!==v);save();render(0)}
 else if(a==='approve'&&t){t.review='approved';t.note='';logAct(`Approved “${t.title}” by ${who(t.to)}`);save();closeM();toast('Task approved');render(0)}
 else if(a==='rework'&&t){t.status='processing';t.review='rework';t.done=null;t.note=($('#rn').value||'').trim();logAct(`Sent “${t.title}” back to ${who(t.to)}`);save();closeM();toast('Sent back to the member');render(0)}
 else if(a==='rpw'){const m=db.members.find(x=>x.id===id);m.hash=await hash(DEF);save();toast(`${m.name}'s password is now ${DEF}`)}
 else if(a==='wipe'&&confirm('This erases every task, file, member login and the admin account in this browser. Continue?')){localStorage.removeItem(K);localStorage.removeItem(SK);location.reload()}
 else if(a==='ghload')loadGh(id);
 else if(a==='ghchange')ghGate(false);
 else if(a==='commits')loadCommits(id);
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k){F[k]=e.target.value;$('#tlist').innerHTML=listHtml()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='all')$$('[name=to]').forEach(c=>c.checked=t.checked);
 if(t.dataset.up){const fl=[...t.files];t.value='';addFiles(t.dataset.up,fl)}
 if(t.dataset.repo){const x=task(t.dataset.repo),val=t.value.trim();if(val&&!/^https?:\/\//i.test(val))return toast('The repo link must start with https://','err');x.repo=val;logAct(`${who(x.to)} linked a repo on “${x.title}”`);save();toast('Repository saved')}
});
document.addEventListener('submit',async e=>{const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();const g=n=>f.elements[n]&&f.elements[n].value;
 if(k==='setup'){if(g('pw')!==g('pw2'))return toast('Passwords do not match','err');db.admin={email:g('email').trim().toLowerCase(),hash:await hash(g('pw'))};logAct('Workspace created');save();ses={role:'admin'};localStorage.setItem(SK,JSON.stringify(ses));tab='home';render()}
 else if(k==='login'){const em=g('email').trim().toLowerCase(),h=await hash(g('pw'));
  if(g('role')==='admin'){if(!db.admin||em!==db.admin.email||h!==db.admin.hash)return toast('Wrong admin email or password','err');ses={role:'admin'}}
  else{const m=db.members.find(x=>x.email===em&&x.hash===h);if(!m)return toast('Wrong team email or password','err');ses={role:'member',id:m.id}}
  localStorage.setItem(SK,JSON.stringify(ses));tab='home';render()}
 else if(k==='task'){const to=new FormData(f).getAll('to');if(!to.length)return toast('Pick at least one member','err');const grp=uid();
  to.forEach(m=>db.tasks.push({id:uid(),group:grp,title:g('title').trim(),desc:g('desc').trim(),to:m,due:g('due'),prio:g('prio'),status:'pending',review:null,note:'',files:[],repo:'',created:Date.now(),done:null}));
  logAct(`Shared “${g('title').trim()}” with ${to.map(who).join(', ')}`);if(!save())return;closeM();toast('Task shared');render(0)}
 else if(k==='gh'){const name=g('user').trim().replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/^@/,'').split('/')[0];
  if(!/^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i.test(name))return toast('That is not a valid GitHub username','err');
  const btn=f.querySelector('.btn');btn.disabled=true;btn.textContent='Checking…';const r=await ghGet('/users/'+encodeURIComponent(name));
  if(r.status===404){btn.disabled=false;btn.textContent='Connect GitHub';return toast('No GitHub account with that name','err')}
  const m=db.members.find(x=>x.id===ses.id);m.gh=r.ok?{user:r.data.login,avatar:r.data.avatar_url,url:r.data.html_url,repos:r.data.public_repos,verified:true,at:Date.now()}:{user:name,url:'https://github.com/'+name,verified:false,at:Date.now()};
  logAct(`${m.name} connected GitHub @${m.gh.user}`);save();closeM();toast(r.ok?'GitHub connected':'Saved, but GitHub could not be reached so it is unverified');render(0)}
});

function animate(){$$('[data-count]').forEach(el=>{const n=+el.dataset.count,t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)})}
function render(fresh=1){const y=window.scrollY;document.body.classList.toggle('still',!fresh);const u=me();
 if(!u){if(ses){ses=null;localStorage.removeItem(SK)}app.innerHTML=authView();return}
 app.innerHTML=shell(u);if(fresh)animate();window.scrollTo(0,fresh?0:y);
 if(u.role==='member'&&!u.gh)ghGate(true)}
(async()=>{if(!db||!db.members){const h=await hash(DEF);db={admin:null,members:NAMES.map(n=>({id:uid(),name:n,email:n.toLowerCase()+'@vartistic.com',hash:h,gh:null})),tasks:[],log:[]};save()}render()})();
</script>
</body>
</html>
