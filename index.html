<style>
:root{--bg:#0b0b0c;--ink:#f4f3f0;--mute:#9b9ba1;--acc:#ff5c35;--blue:#5b92ff;--amber:#f5a524;--mint:#2fcf8a;--coral:#ef4444;--line:rgba(255,255,255,.1);--g1:rgba(255,255,255,.05);--g2:rgba(255,255,255,.1);--inp:rgba(0,0,0,.4);--track:rgba(255,255,255,.1);--sheet:rgba(22,22,24,.96);--solid:#161618;--btn:#ff5c35;--r:20px;color-scheme:dark}
[data-theme=light]{--bg:#f6f3ee;--ink:#19191b;--mute:#69696f;--acc:#dc3a14;--blue:#2f6df0;--amber:#c76a00;--mint:#0f8a5c;--coral:#d92d2d;--line:rgba(25,25,27,.1);--g1:rgba(255,255,255,.78);--g2:#fff;--inp:rgba(255,255,255,.95);--track:rgba(25,25,27,.09);--sheet:rgba(255,255,255,.98);--solid:#fff;--btn:#dc3a14;color-scheme:light}
[data-theme=light] .bgf i:nth-child(1){background:#ffd2bf;opacity:.6}[data-theme=light] .bgf i:nth-child(2){background:#ffe3b8;opacity:.5}[data-theme=light] .bgf i:nth-child(3){background:#ffc2b0;opacity:.35}
[data-theme=light] .glass{box-shadow:0 8px 26px rgba(25,25,27,.07),inset 0 1px 0 #fff}
[data-theme=light] .seg3 .on,[data-theme=light] .pill.on{color:#fff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.bgf{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bgf i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 20s ease-in-out infinite alternate}
.bgf i:nth-child(1){width:46vw;height:46vw;background:#ff5c35;left:-14vw;top:-18vw;opacity:.16}
.bgf i:nth-child(2){width:34vw;height:34vw;background:#8a1f12;right:-10vw;top:26vh;opacity:.22;animation-delay:-7s}
.bgf i:nth-child(3){width:30vw;height:30vw;background:#ff8a3d;left:30vw;bottom:-20vw;opacity:.1;animation-delay:-12s}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dasharray:0 400}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.glass{background:var(--g1);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14);animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.still .glass,.still .seg,.still .bar,.still .col i,.still .pg i{animation:none!important}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
h2{font-size:30px;line-height:1.1}h3{font-size:18px;margin-bottom:14px}h4{margin:18px 0 8px;font-size:15px}
p{color:var(--mute)}small,.tiny{color:var(--mute);font-size:13px}.mute{color:var(--mute)}
a{color:var(--acc)}
input,select,textarea{width:100%;background:var(--inp);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:11px 14px;font:inherit;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,92,53,.18)}
select option{background:var(--solid)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
.f{display:block;margin-top:14px;font-size:14px;color:var(--mute)}.f input,.f select,.f textarea{margin-top:6px;color:var(--ink)}
.btn{background:var(--btn);color:#fff;border:0;border-radius:13px;padding:11px 20px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.25s;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,92,53,.35)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.ghost{background:var(--g1);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{box-shadow:none;background:var(--g2)}
.btn.danger{color:var(--coral)}.btn.sm{padding:7px 14px;font-size:13px}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.card-auth{width:min(420px,100%);padding:36px;position:relative}
.card-auth h1{font-size:30px;margin:18px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:9px 9px 9px 3px;background:linear-gradient(135deg,var(--acc),#ff8a5c);display:inline-block;animation:spin 8s linear infinite}
@keyframes spin{50%{border-radius:3px 9px 9px 9px}}
.pills{display:flex;gap:8px;margin:20px 0 4px}.pills label{flex:1;position:relative}.pills input{position:absolute;opacity:0}
.pills span{display:block;text-align:center;padding:10px;border-radius:13px;border:1px solid var(--line);cursor:pointer;transition:.2s}
.pills input:checked+span{background:var(--acc);color:#fff;font-weight:600}.pills input:focus-visible+span{outline:2px solid var(--acc)}
.card-auth .btn{width:100%;margin-top:22px}.card-auth .tiny{margin-top:16px}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;gap:22px;padding:22px;min-height:100vh}
.side{position:sticky;top:22px;height:calc(100vh - 44px);display:flex;flex-direction:column;padding:22px 14px}
.side .brand{padding:0 10px 24px}
nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:0;background:none;color:var(--mute);font:500 15px inherit;font-family:inherit;cursor:pointer;transition:.25s;text-align:left}
.nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv:hover{background:var(--g2);color:var(--ink);transform:translateX(3px)}
.nv.on{background:rgba(255,92,53,.18);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(255,92,53,.35)}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.me div{flex:1;line-height:1.2;min-width:0}.me small{display:block}
.ico{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;transition:.2s}.ico:hover{color:var(--coral);border-color:var(--coral)}
.av{position:relative;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff5c35,#ff8a5c);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 24px;gap:12px;flex-wrap:wrap}
.view>*+*{margin-top:18px}
/* home */
.stats{display:flex;flex-wrap:wrap;gap:16px}.stats .stat{flex:1 1 140px;min-width:0}
.stat{padding:20px}.stat b{display:block;font-size:40px;line-height:1;font-weight:800;margin-bottom:6px}.stat span{color:var(--mute);font-size:14px}
.stat.blue{background:rgba(91,146,255,.1);border-color:rgba(91,146,255,.3)}.stat.blue span{color:var(--blue)}
.stat.amber{background:rgba(245,165,36,.1);border-color:rgba(245,165,36,.3)}.stat.amber span{color:var(--amber)}
.stat.mint{background:rgba(47,207,138,.09);border-color:rgba(47,207,138,.3)}.stat.mint span{color:var(--mint)}
.stat.acc{background:rgba(255,92,53,.1);border-color:rgba(255,92,53,.32)}.stat.acc span{color:var(--acc)}
.cols{display:grid;grid-template-columns:minmax(280px,1fr) 1.6fr;gap:18px}.cols2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.panel{padding:24px}
.dwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:none}.seg{animation:draw 1.2s cubic-bezier(.3,.7,.2,1) both}
.dn{font:800 30px 'Bricolage Grotesque',sans-serif;fill:var(--ink)}.dl{font-size:11px;fill:var(--mute)}
.lg{display:flex;flex-direction:column;gap:10px}.lg div{display:flex;align-items:center;gap:10px}.lg i{width:11px;height:11px;border-radius:4px}.lg b{margin-left:auto;padding-left:18px}
i.pending,.bar i.pending{background:var(--amber)}i.processing{background:var(--blue)}i.completed{background:var(--mint)}
.wl{display:grid;grid-template-columns:70px 1fr 44px;gap:12px;align-items:center;margin:12px 0}
.wl em{font-style:normal;color:var(--mute);font-size:13px;text-align:right}
.bar{display:flex;height:12px;border-radius:9px;overflow:hidden;transform-origin:left;animation:grow 1s cubic-bezier(.3,.7,.2,1) both;min-width:6px}.bar i{height:100%}
.week{display:flex;gap:10px;height:160px}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bw{flex:1;width:100%;display:flex;align-items:flex-end}.col i{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(var(--mint),#3e9c7c);transform-origin:bottom;animation:rise .9s cubic-bezier(.3,.7,.2,1) both;min-height:5px}
.col.z i{background:var(--track)}.col small{font-size:12px}.col b{font-size:13px}
.ev{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column}.ev:last-child{border:0}.ev span{color:var(--mute);font-size:13px}
.empty{padding:34px;text-align:center;color:var(--mute)}
/* tasks */
.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:14px}
.list{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:18px 22px;transition:.3s}.row:hover{transform:translateY(-3px);background:var(--g2)}
.row p{font-size:14px;margin:2px 0 8px;max-width:60ch}.rs{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.ra{display:flex;gap:8px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}.meta .late{color:var(--coral);font-weight:600}
.pr{font-weight:600}.pr.high{color:var(--coral)}.pr.medium{color:var(--amber)}.pr.low{color:var(--mint)}
.chip{font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid;white-space:nowrap}
.chip.pending,.chip.wait{color:var(--amber);background:rgba(245,165,36,.13);border-color:rgba(245,165,36,.38)}
.chip.processing{color:var(--blue);background:rgba(91,146,255,.13);border-color:rgba(91,146,255,.38)}
.chip.bad{color:var(--coral);background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.4)}
.chip.completed{color:var(--mint);background:rgba(47,207,138,.14);border-color:rgba(47,207,138,.4)}
.task{padding:22px;transition:.3s}.task:hover{transform:translateY(-3px)}
.th{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.th b{font-size:18px}.task>p{margin:10px 0 14px}
.note{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.4);border-radius:13px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.seg3{display:inline-flex;background:var(--inp);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg3 button{border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:11px;font:500 14px inherit;font-family:inherit;cursor:pointer;transition:.25s}
.seg3 button:hover{color:var(--ink)}.seg3 .on{color:#2a1d04;font-weight:600}.seg3 .on.pending{background:var(--amber)}.seg3 .on.processing{background:var(--blue)}.seg3 .on.completed{background:var(--mint)}
.up{margin-top:18px;padding:18px;border-radius:16px;border:1.5px dashed rgba(47,207,138,.5);background:rgba(47,207,138,.07);animation:pop .45s both}
.uh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.file{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-top:8px;border-radius:12px;background:var(--inp)}.file a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:8px}.x:hover{color:var(--coral)}
/* team + github */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.mc{padding:22px;transition:.3s}.mc:hover{transform:translateY(-4px)}.mh{display:flex;gap:12px;align-items:center;margin-bottom:16px}.mh div{line-height:1.25}.mh small{display:block}
.pg{height:8px;border-radius:9px;background:var(--track);overflow:hidden;margin-bottom:10px}.pg i{display:block;height:100%;background:var(--mint);border-radius:9px;transform-origin:left;animation:grow 1s both}
.mm{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
.gl{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:14px}.gl em{font-style:normal;font-size:12px;color:var(--mute)}.gl em.ok{color:var(--mint)}
.act{margin:6px 0 14px;font-size:14px}
.tip{padding:14px 20px}code{background:var(--inp);padding:2px 8px;border-radius:8px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;z-index:20;overflow:auto}
.sheet{width:min(560px,100%);padding:28px;animation:pop .4s cubic-bezier(.2,.8,.2,1) both;background:var(--sheet);max-height:calc(100vh - 36px);overflow:auto}
.mt{display:flex;justify-content:space-between;align-items:flex-start}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chk label{display:flex;gap:7px;align-items:center;padding:7px 14px;border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--ink);transition:.2s}.chk label:hover{background:var(--g2)}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.tt{background:var(--sheet);backdrop-filter:blur(14px);border:1px solid var(--line);border-left:4px solid var(--mint);padding:12px 18px;border-radius:14px;animation:pop .35s both;max-width:320px}.tt.err{border-left-color:var(--coral)}

.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--line)}.logo.big{width:76px;height:76px}
.card-auth .brand{flex-direction:column;align-items:flex-start;gap:12px}
.tgl{position:absolute;top:18px;right:18px}.tgl .ico{width:auto}
.ico{display:inline-flex;align-items:center;gap:6px;justify-content:center}.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:none}
.me .ico{flex:1 1 45%}.me div{flex:1 1 120px;min-width:0}
.bd{background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:auto}
main{min-width:0}.view>*{min-width:0}.tact{display:flex;gap:10px;flex-wrap:wrap}
p,b,.row,.ev,small{overflow-wrap:anywhere}
.click{cursor:pointer}.stack{display:flex}.stack .av{width:30px;height:30px;font-size:13px;margin-right:-8px;border:2px solid var(--bg)}
.pill{padding:8px 15px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink);font:inherit;cursor:pointer;transition:.2s}.pill:hover{background:var(--g2)}.pill.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.note.approved{background:rgba(47,207,138,.14);border-color:rgba(47,207,138,.4)}.note small{display:block;margin-bottom:2px}
.shr{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.shr select{flex:1;min-width:200px;width:auto}
.cnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.cnav h3{margin:0;flex:1;min-width:140px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal>b{text-align:center;font-size:12px;color:var(--mute);font-weight:500}
.cd{aspect-ratio:1;min-height:42px;border-radius:14px;border:1px solid var(--line);background:var(--g1);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;transition:.2s;padding:0}
.cd:hover{background:var(--g2);transform:translateY(-2px)}.cd.today{border-color:var(--acc);border-width:2px}.cd.sel{background:var(--acc);color:#fff;font-weight:700}.cd.off{visibility:hidden}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%}.dots i.info{background:var(--ink)}.cd.sel .dots i.info{background:#fff}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding-top:10px}.pc{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(30%,150px);text-align:center}
.pb{width:100%;border-radius:14px 14px 0 0;background:linear-gradient(var(--acc),transparent);display:grid;place-items:center;transform-origin:bottom;animation:rise .9s cubic-bezier(.3,.7,.2,1) both}.pb em{font:800 28px 'Bricolage Grotesque',sans-serif;font-style:normal}
.lr{display:grid;grid-template-columns:34px minmax(130px,1.6fr) repeat(4,minmax(54px,.6fr)) minmax(120px,1fr);gap:12px;align-items:center;padding:14px 20px;transition:.3s}.lr:hover{transform:translateY(-3px);background:var(--g2)}
.lr span{line-height:1.2}.lr small{display:block;font-size:11px}.lr .who{display:flex;gap:10px;align-items:center}.rk{font-size:20px;color:var(--acc)}
.strip{display:flex;gap:3px}.strip i{width:9px;height:20px;border-radius:3px;background:var(--track)}.strip i.on{background:var(--mint)}.strip i.gh{background:var(--acc)}
.wl.click:hover em{color:var(--ink)}
@media(max-width:1100px){.shell{grid-template-columns:76px 1fr;gap:16px;padding:16px}.side .brand span,.nv span,.me div,.me .ico span{display:none}.me .ico svg{display:block}.side .brand{padding:0 0 18px;justify-content:center}.nv{justify-content:center;padding:12px 0}.me{flex-direction:column;justify-content:center}.me .ico{width:100%;padding:8px 0}.nv .bd{position:absolute;margin:0;transform:translate(14px,-12px)}.nv{position:relative}}
@media(max-width:900px){.cols,.cols2,.tools{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
@media(max-width:820px){.shell{grid-template-columns:1fr;padding:14px 14px 92px}.side{position:fixed;z-index:10;top:auto;bottom:10px;left:10px;right:10px;height:auto;flex-direction:row;padding:6px;gap:4px;align-items:center}
.side .brand,.me div,.me .av{display:none}nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;gap:2px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.nv{padding:11px;flex:none}.nv:hover{transform:none}
.me{border:0;padding:0;flex-direction:row;flex-wrap:nowrap;gap:4px;width:auto}.me .ico{width:42px;height:42px;padding:0;flex:none}.two{grid-template-columns:1fr}.top{margin-bottom:16px}h2{font-size:24px}.card-auth{padding:26px}.donut{width:140px;height:140px}.sheet{padding:20px}
.lr{grid-template-columns:34px 1fr 1fr}.lr .strip{grid-column:1/-1}.lr .who{grid-column:2/4}#toast{bottom:84px;right:12px;left:12px}}
@media(max-width:480px){.stats .stat{flex:1 1 40%}.stat{padding:16px}.stat b{font-size:32px}.cd{min-height:36px;border-radius:10px;font-size:13px}.cal{gap:4px}.pod{gap:8px}.tools{padding:10px}.btns .btn{flex:1;text-align:center}.panel{padding:18px}.card-auth{padding:22px}.wl{grid-template-columns:56px 1fr 38px;gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

async function hash(t){const s='vt::'+t;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'x'+h}

/* github */
async function ghGet(path){const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch('https://api.github.com'+path,{signal:c.signal,headers:{Accept:'application/vnd.github+json'}});clearTimeout(t);return{ok:r.ok,status:r.status,data:r.ok?await r.json():null}}catch(e){clearTimeout(t);return{ok:false,status:0,data:null}}}
async function loadGh(id){const m=db.members.find(x=>x.id===id),box=$('#gh-'+id);if(!m||!m.gh||!box)return;box.innerHTML='<small>Loading…</small>';const r=await ghGet(`/users/${encodeURIComponent(m.gh.user)}/events/public?per_page=30`);
 if(!r.ok){box.innerHTML=`<small>${r.status===403?'GitHub rate limit reached. Try again in a while.':'Could not reach GitHub from here. Open the profile link instead.'}</small>`;return}
 const p=r.data.filter(e=>e.type==='PushEvent').slice(0,4);
 box.innerHTML=p.length?p.map(e=>{const c=e.payload.commits&&e.payload.commits[0],n=e.payload.size||(e.payload.commits||[]).length;return`<div class="ev"><b>${esc(e.repo.name)}</b><span>Branch ${esc((e.payload.ref||'').replace('refs/heads/',''))}, ${n} commit${n==1?'':'s'}, ${ago(Date.parse(e.created_at))}</span>${c?`<small>${esc(c.message.split('\n')[0])}</small>`:''}</div>`}).join(''):'<small>No public pushes lately.</small>'}
async function loadCommits(id,isP){const t=isP?proj(id):task(id),box=$((isP?'#pc-':'#cm-')+id);if(!t||!box)return;const m=(t.repo||'').match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/i);if(!m){box.innerHTML='<small>Link must look like https://github.com/owner/repo</small>';return}
 box.innerHTML='<small>Loading…</small>';const r=await ghGet(`/repos/${m[1]}/${m[2].replace(/\.git$/,'')}/commits?per_page=3`);
 if(!r.ok){box.innerHTML=`<small>${r.status===404?'Repository not found, or it is private.':'Could not reach GitHub from here.'}</small>`;return}
 box.innerHTML=r.data.map(c=>`<div class="ev"><b>${esc(c.commit.message.split('\n')[0])}</b><span>${esc(c.commit.author.name)}, ${ago(Date.parse(c.commit.author.date))}</span></div>`).join('')||'<small>No commits yet.</small>'}

function donut(s){const C=2*Math.PI*52,col={pending:'var(--amber)',processing:'var(--blue)',completed:'var(--mint)'};let acc=0;
 const segs=s.total?['pending','processing','completed'].map(k=>{const l=s[k]/s.total*C,el=`<circle class="seg" cx="70" cy="70" r="52" fill="none" stroke="${col[k]}" stroke-width="15" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=l;return el}).join(''):'';
 return`<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Task status chart"><circle cx="70" cy="70" r="52" fill="none" style="stroke:var(--track)" stroke-width="15"/>${segs}<text x="70" y="72" text-anchor="middle" class="dn">${s.total}</text><text x="70" y="90" text-anchor="middle" class="dl">total tasks</text></svg>`}
function week(l){const d=[];for(let i=6;i>=0;i--){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-i);d.push({l:x.toLocaleDateString('en',{weekday:'short'}),s:+x,n:0})}l.forEach(t=>{if(t.done){const k=d.find(o=>t.done>=o.s&&t.done<o.s+864e5);if(k)k.n++}});return d}

const pad=n=>String(n).padStart(2,'0');
const dk=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=ts=>new Date(ts).toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'});
const proj=id=>db.projects.find(p=>p.id===id);

const lastFb=t=>[...t.feedback].reverse().find(f=>f.kind==='rework')||{at:t.created,text:t.note||''};
function streakOf(id){const d=db.days[id]||{},ks=Object.keys(d).sort();let best=0,run=0,prev=null;
 ks.forEach(k=>{run=prev&&Math.round((new Date(k+'T00:00')-new Date(prev+'T00:00'))/864e5)===1?run+1:1;best=Math.max(best,run);prev=k});
 let cur=0;const c=new Date();c.setHours(0,0,0,0);if(!d[dk(c)])c.setDate(c.getDate()-1);while(d[dk(c)]){cur++;c.setDate(c.getDate()-1)}
 return{cur,best,total:ks.length}}
const board=()=>db.members.map(m=>{const s=streakOf(m.id),ap=db.tasks.filter(t=>t.to===m.id&&t.review==='approved').length;return{m,...s,ap,pts:s.cur*10+s.total*2+ap*5}}).sort((a,b)=>b.cur-a.cur||b.pts-a.pts||a.m.name.localeCompare(b.m.name));
async function syncDays(id){const m=db.members.find(x=>x.id===id);if(!m||!m.gh)return 0;const r=await ghGet(`/users/${encodeURIComponent(m.gh.user)}/events/public?per_page=100`);if(!r.ok)return -1;
 const tr=db.projects.map(p=>((p.repo||'').match(/github\.com\/([^\/\s]+\/[^\/\s#?]+)/i)||[])[1]).filter(Boolean).map(x=>x.replace(/\.git$/,'').toLowerCase());let n=0;db.days[id]=db.days[id]||{};
 r.data.filter(e=>e.type==='PushEvent'&&(!tr.length||tr.includes(e.repo.name.toLowerCase()))).forEach(e=>{const k=dk(Date.parse(e.created_at));if(db.days[id][k]!=='github'){db.days[id][k]='github';n++}});save();return n}

async function addFiles(id,files){const t=task(id);if(!t)return;const before=t.files.length;
 for(const f of files){if(f.size>1.5*1048576){toast(`${f.name} is over 1.5 MB. Push it to GitHub and paste the link.`,'err');continue}
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});t.files.push({id:uid(),name:f.name,size:f.size,type:f.type,data,at:Date.now()})}
 if(t.files.length===before)return;logAct(`${who(t.to)} uploaded ${t.files.length-before} file(s) to “${t.title}”`);if(!save()){t.files.length=before;db.log.shift();return}toast('Files uploaded');render(0)}

document.addEventListener('click',async e=>{
 if(e.target.classList&&e.target.classList.contains('scrim')&&!lock)return closeM();

 if(a==='close')return closeM();

 const u=me();if(!u)return;const t=id?task(id):null;
 if(a==='newtask')newTask();
 else if(a==='view')viewTask(id);
 else if(a==='del'&&t&&confirm('Delete this task for good?')){db.tasks=db.tasks.filter(x=>x.id!==id);logAct(`Deleted “${t.title}”`);save();render(0)}
 else if(a==='set'&&t&&t.to===u.id&&t.status!==v){t.status=v;t.done=v==='completed'?Date.now():null;t.share=null;t.sharedAt=null;if(v==='completed'){t.review=null;t.note=''}else if(t.review==='approved')t.review=null;logAct(`${u.name} moved “${t.title}” to ${ST[v]}`);save();render(0)}
 else if(a==='rmf'&&t){t.files=t.files.filter(f=>f.id!==v);if(!t.files.length&&!t.repo)t.share=null;save();render(0)}
 else if(a==='share'&&t&&t.to===u.id){if(!t.files.length&&!t.repo)return toast('Add a file or a repo link first','err');t.share=$(`[data-sh="${id}"]`).value;t.sharedAt=Date.now();logAct(`${u.name} shared “${t.title}” with ${t.share==='team'?'the team':'the admin'}`);save();toast('Saved and shared');render(0)}
 else if(a==='approve'&&t&&u.role==='admin'){const n=($('#rn').value||'').trim();t.review='approved';t.note='';if(n)t.feedback.push({at:Date.now(),text:n,kind:'approved'});logAct(`Approved “${t.title}” by ${who(t.to)}`);save();closeM();toast('Task approved');render(0)}

 else if(a==='person'){pid=id;tab='person';render()}

 else if(a==='newproj'&&u.role==='admin')newProject();
 else if(a==='newupd'&&u.role==='admin')newUpdate();
 else if(a==='delupd'&&u.role==='admin'&&confirm('Delete this update?')){db.updates=db.updates.filter(x=>x.id!==id);save();render(0)}
 else if(a==='delproj'&&u.role==='admin'&&confirm('Delete this project? Its tasks stay but lose the project link.')){db.projects=db.projects.filter(p=>p.id!==id);[...db.tasks,...db.updates,...db.dailies].forEach(x=>{if(x.project===id)x.project=''});tab='projects';save();render()}
 else if(a==='collab'&&u.role==='admin'){const p=proj(id);if(!p)return;const i=p.members.indexOf(v);if(i<0)p.members.push(v);else p.members.splice(i,1);logAct(`${i<0?'Added':'Removed'} ${who(v)} ${i<0?'to':'from'} ${p.name}`);save();render(0)}
 else if(a==='pcommits')loadCommits(id,true);
 else if(a==='day'){cal.sel=v;render(0)}
 else if(a==='calnav'){if(v==='0'){const n=new Date();cal.y=n.getFullYear();cal.m=n.getMonth();cal.sel=dk(n)}else{const d=new Date(cal.y,cal.m+ +v,1);cal.y=d.getFullYear();cal.m=d.getMonth()}render(0)}
 else if(a==='sync'){b.disabled=true;let tot=0,bad=0;for(const m of(u.role==='admin'?db.members:db.members.filter(x=>x.id===u.id))){const n=await syncDays(m.id);if(n<0)bad++;else tot+=n}toast(bad?'GitHub could not be reached for some accounts':`Synced ${tot} new commit day${tot==1?'':'s'}`,bad?'err':'');render(0)}
 else if(a==='rpw'){const m=db.members.find(x=>x.id===id);m.hash=await hash(DEF);save();toast(`${m.name}'s password is now ${DEF}`)}
 else if(a==='wipe'&&confirm('This erases every task, file, member login and the admin account in this browser. Continue?')){localStorage.removeItem(K);localStorage.removeItem(SK);location.reload()}
 else if(a==='ghload')loadGh(id);
 else if(a==='ghchange')ghGate(false);
 else if(a==='commits')loadCommits(id);
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k){F[k]=e.target.value;$('#tlist').innerHTML=listHtml()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='all')$$('[name=to]').forEach(c=>c.checked=t.checked);
 if(t.dataset.cal==='who'){cal.who=t.value;render(0)}
 if(t.dataset.prepo){const p=proj(t.dataset.prepo),val=t.value.trim();if(val&&!/^https?:\/\//i.test(val))return toast('The repo link must start with https://','err');p.repo=val;save();toast('Repository saved');render(0)}
 if(t.dataset.up){const fl=[...t.files];t.value='';addFiles(t.dataset.up,fl)}
 if(t.dataset.repo){const x=task(t.dataset.repo),val=t.value.trim();if(val&&!/^https?:\/\//i.test(val))return toast('The repo link must start with https://','err');x.repo=val;logAct(`${who(x.to)} linked a repo on “${x.title}”`);save();toast('Repository saved')}
});
document.addEventListener('submit',async e=>{const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();const g=n=>f.elements[n]&&f.elements[n].value;
 if(k==='setup'){if(g('pw')!==g('pw2'))return toast('Passwords do not match','err');db.admin={email:g('email').trim().toLowerCase(),hash:await hash(g('pw'))};logAct('Workspace created');save();ses={role:'admin'};localStorage.setItem(SK,JSON.stringify(ses));tab='home';render()}
 else if(k==='login'){const em=g('email').trim().toLowerCase(),h=await hash(g('pw'));
  if(g('role')==='admin'){if(!db.admin||em!==db.admin.email||h!==db.admin.hash)return toast('Wrong admin email or password','err');ses={role:'admin'}}
  else{const m=db.members.find(x=>x.email===em&&x.hash===h);if(!m)return toast('Wrong team email or password','err');ses={role:'member',id:m.id}}
  localStorage.setItem(SK,JSON.stringify(ses));tab='home';render()}
 else if(k==='task'){const to=new FormData(f).getAll('to');if(!to.length)return toast('Pick at least one member','err');const grp=uid(),pj=g('project'),title=g('title').trim();
  to.forEach(m=>db.tasks.push({id:uid(),group:grp,title,desc:g('desc').trim(),to:m,due:g('due'),prio:g('prio'),project:pj,status:'pending',review:null,note:'',feedback:[],share:null,sharedAt:null,files:[],repo:'',created:Date.now(),done:null}));
  if(pj&&proj(pj))to.forEach(m=>{if(!proj(pj).members.includes(m))proj(pj).members.push(m)});
  logAct(`Shared “${title}” with ${to.map(who).join(', ')}`);if(!save())return;closeM();toast('Task shared');render(0)}
 else if(k==='project'){const ms=new FormData(f).getAll('m'),name=g('name').trim(),repo=g('repo').trim();if(repo&&!/^https?:\/\//i.test(repo))return toast('The repo link must start with https://','err');db.projects.push({id:uid(),name,client:g('client').trim(),desc:g('desc').trim(),repo,members:ms,created:Date.now()});logAct(`Created project “${name}”`);if(!save())return;closeM();toast('Project created');render(0)}
 else if(k==='upd'){db.updates.push({id:uid(),title:g('title').trim(),text:g('text').trim(),project:g('project'),at:Date.now()});logAct(`Client update: ${g('title').trim()}`);if(!save())return;closeM();toast('Update posted');render(0)}
 else if(k==='daily'){const p=proj(f.dataset.id),mu=me();if(!p||!mu||!(mu.role==='admin'||p.members.includes(mu.id)))return toast('Only collaborators can post here','err');
  const none=f.elements.none.checked,cm=f.elements.commit.checked&&!none,td=dk(Date.now());
  db.dailies.push({id:uid(),project:p.id,by:mu.role==='admin'?'admin':mu.id,text:g('text').trim(),date:td,at:Date.now(),commit:cm,none});
  if(cm&&mu.role!=='admin'){db.days[mu.id]=db.days[mu.id]||{};if(!db.days[mu.id][td])db.days[mu.id][td]='self'}
  logAct(`${mu.name} posted a daily update on ${p.name}`);if(!save())return;toast(cm?'Update posted, streak counted':'Update posted');render(0)}
 else if(k==='gh'){const name=g('user').trim().replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/^@/,'').split('/')[0];
  if(!/^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i.test(name))return toast('That is not a valid GitHub username','err');
  const btn=f.querySelector('.btn');btn.disabled=true;btn.textContent='Checking…';const r=await ghGet('/users/'+encodeURIComponent(name));
  if(r.status===404){btn.disabled=false;btn.textContent='Connect GitHub';return toast('No GitHub account with that name','err')}
  const m=db.members.find(x=>x.id===ses.id);m.gh=r.ok?{user:r.data.login,avatar:r.data.avatar_url,url:r.data.html_url,repos:r.data.public_repos,verified:true,at:Date.now()}:{user:name,url:'https://github.com/'+name,verified:false,at:Date.now()};
  logAct(`${m.name} connected GitHub @${m.gh.user}`);save();closeM();toast(r.ok?'GitHub connected':'Saved, but GitHub could not be reached so it is unverified');render(0)}
});

function animate(){$$('[data-count]').forEach(el=>{const n=+el.dataset.count,t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)})}
function render(fresh=1){const y=window.scrollY;document.body.classList.toggle('still',!fresh);const u=me();
 if(!u){if(ses){ses=null;localStorage.removeItem(SK)}app.innerHTML=authView();return}
 app.innerHTML=shell(u);tick();if(fresh)animate();window.scrollTo(0,fresh?0:y);
 if(u.role==='member'&&!u.gh)ghGate(true)}
(async()=>{if(!db||!db.members){const h=await hash(DEF);db={admin:null,members:NAMES.map(n=>({id:uid(),name:n,email:n.toLowerCase()+'@vartistic.com',hash:h,gh:null})),tasks:[],log:[]};save()}norm();render()})();
</script>
